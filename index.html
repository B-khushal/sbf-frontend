    <script>
      (function () {
        var path = window.location.pathname || "/";
        var isAdmin = path.indexOf("/admin") === 0;
        var isVendor = path.indexOf("/vendor") === 0;
        var manifestPath = null;

        if (isAdmin) {
          manifestPath = "/manifest-admin.json";
        } else if (isVendor) {
          manifestPath = "/manifest-vendor.json";
        }

        if (manifestPath) {
          var manifestLink = document.querySelector('link[rel="manifest"]');
          if (manifestLink) {
            manifestLink.setAttribute("href", manifestPath);
          } else {
            manifestLink = document.createElement("link");
            manifestLink.rel = "manifest";
            manifestLink.href = manifestPath;
            document.head.appendChild(manifestLink);
          }
          var themeMeta = document.querySelector('meta[name="theme-color"]');
          if (themeMeta) {
            themeMeta.setAttribute("content", "#0f172a");
          }
        }
      })();
    </script>

# ============================================
# Nginx Configuration for SBF Florist Frontend
# ============================================
# Optimized for Docker + Dokploy deployment
# Domain: sbflorist.in | API: api.sbflorist.in
# ============================================

server {
    listen 80;
    listen [::]:80;
    listen 3000;
    listen [::]:3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ── Prevent Port 3000 & Insecure Scheme Leaks in Redirects ──
    port_in_redirect off;
    absolute_redirect off;

    # ── Character Encoding ──────────────────
    charset utf-8;

    # ── Security Headers ──────────────────────
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Allow Google OAuth popup and fix FedCM issues
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
    add_header Cross-Origin-Embedder-Policy "unsafe-none" always;

    # Increase client max body size for file uploads
    client_max_body_size 50M;

    # ── Health Check Endpoint ─────────────────
    location = /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # ── AI Search & Discovery (llms.txt) ───────
    location = /llms.txt {
        default_type text/plain;
        add_header Cache-Control "public, max-age=86400";
        try_files /llms.txt =404;
    }

    # ── Real 404 for Unknown Well-Known Routes ─
    location ^~ /.well-known/ {
        try_files $uri =404;
    }

    # ── Static Sitemaps & Robots.txt ──────────
    # Served directly from /usr/share/nginx/html (copied from public/ at build time)
    location ~* ^/sitemap.*\.xml$ {
        default_type application/xml;
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    location = /robots.txt {
        default_type text/plain;
        add_header Cache-Control "public, max-age=86400";
        try_files /robots.txt =404;
    }

    # ── Never Cache Entry HTML or Service Workers ─────────────
    # Note: Using `expires -1` emits `Cache-Control: no-cache` while preserving
    # all server-level security & Google OAuth COOP/COEP headers.
    location = /index.html {
        expires -1;
    }

    location ~* ^/(service-worker|sw)\.js$ {
        expires -1;
    }

    # ── Static Asset Caching ──────────────────
    # Vite hashed assets — long cache (1 year)
    location ~* \.(?:js|css|woff2?|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Images — moderate cache (30 days)
    location ~* \.(?:png|jpg|jpeg|gif|ico|svg|webp|avif)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # ── Gzip Compression ─────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        application/atom+xml
        image/svg+xml;
    gzip_disable "MSIE [1-6]\.";

    # ── Non-Indexable Private User & Auth Routes ─────────────
    # Emit explicit X-Robots-Tag so search engines drop utility/private pages
    location ~* ^/(checkout|cart|orders|profile|account|login|signup|register|forgot-password|track)(/.*)?$ {
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
        add_header Cross-Origin-Embedder-Policy "unsafe-none" always;
        expires -1;
        try_files $uri $uri/ /index.html;
    }

    # ── Crawler Interceptor for Search Engines & Social Bots ──────
    # Route crawlers to named location (avoids nginx [emerg] proxy_set_header/proxy_pass in if)
    location ~* ^/(product|products|valentine-product|flower-delivery-[^/]+|occasions|shop|about|contact|blog|cakes|combos|roses|bouquets)(/.*)?$ {
        error_page 418 = @crawler_prerender;
        if ($http_user_agent ~* "googlebot|bingbot|google-inspectiontool|chrome-lighthouse|facebookexternalhit|twitterbot|LinkedInBot|whatsapp|telegrambot|discordbot|slackbot|vkShare|redditbot|Applebot|Pinterestbot|YandexBot|DuckDuckBot") {
            return 418;
        }
        expires -1;
        try_files $uri $uri/ /index.html;
    }

    # Named location for SEO crawler prerendering with safe fallback to SPA index.html
    location @crawler_prerender {
        resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
        resolver_timeout 5s;
        set $seo_prerender_url "https://api.sbflorist.in/api/seo/render?path=$uri";
        proxy_pass $seo_prerender_url;
        proxy_ssl_server_name on;
        proxy_set_header Host api.sbflorist.in;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 8s;
        proxy_intercept_errors on;
        error_page 404 500 502 503 504 =200 /index.html;
    }

    # ── SPA Routing ───────────────────────────
    # All non-file routes fall back to index.html for React Router
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }

    # ── Error Pages ───────────────────────────
    error_page 404 /index.html;
    error_page 500 502 503 504 /index.html;
}

# ============================================
# Nginx Configuration for SBF Florist Frontend
# ============================================
# Optimized for Docker + Dokploy deployment
# Domain: sbflorist.in | API: api.sbflorist.in
# ============================================

server {
    listen 80;
    listen [::]:80;
    listen 3000;
    listen [::]:3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ── Prevent Port 3000 & Insecure Scheme Leaks in Redirects ──
    port_in_redirect off;
    absolute_redirect off;

    # ── Character Encoding ──────────────────
    charset utf-8;

    # ── Security Headers ──────────────────────
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Allow Google OAuth popup and fix FedCM issues
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
    add_header Cross-Origin-Embedder-Policy "unsafe-none" always;

    # Increase client max body size for file uploads
    client_max_body_size 50M;

    # ── Health Check Endpoint ─────────────────
    location = /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # ── AI Search & Discovery (llms.txt) ───────
    location = /llms.txt {
        default_type text/plain;
        add_header Cache-Control "public, max-age=86400";
        try_files /llms.txt =404;
    }

    # ── Real 404 for Unknown Well-Known Routes ─
    location ^~ /.well-known/ {
        try_files $uri =404;
    }

    # ── Static Sitemaps & Robots.txt ──────────
    # Served directly from /usr/share/nginx/html (copied from public/ at build time)
    location ~* ^/sitemap.*\.xml$ {
        default_type application/xml;
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    location = /robots.txt {
        default_type text/plain;
        add_header Cache-Control "public, max-age=86400";
        try_files /robots.txt =404;
    }

    # ── Static Asset Caching ──────────────────
    # Vite hashed assets — long cache (1 year)
    location ~* \.(?:js|css|woff2?|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Images — moderate cache (30 days)
    location ~* \.(?:png|jpg|jpeg|gif|ico|svg|webp|avif)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # ── Gzip Compression ─────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        application/atom+xml
        image/svg+xml;
    gzip_disable "MSIE [1-6]\.";

    # ── Crawler Interceptor for Products & Valentine Products ──────
    # Proxy search engines and social bots to the backend to get server-rendered title, meta & schema
    location ~* ^/(product|products|valentine-product)/([^/]+)$ {
        set $is_crawler 0;
        if ($http_user_agent ~* "googlebot|bingbot|google-inspectiontool|chrome-lighthouse|facebookexternalhit|twitterbot|LinkedInBot|whatsapp|telegrambot|discordbot|slackbot|vkShare|redditbot|Applebot|Pinterestbot|YandexBot|DuckDuckBot") {
            set $is_crawler 1;
        }

        if ($is_crawler = 1) {
            proxy_pass http://sbf-backend:5000/api/products/share-preview/$1/$2;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            break;
        }

        try_files $uri $uri/ /index.html;
    }

    # ── SPA Routing ───────────────────────────
    # All non-file routes fall back to index.html for React Router
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Error Pages ───────────────────────────
    error_page 404 /index.html;
    error_page 500 502 503 504 /index.html;
}
